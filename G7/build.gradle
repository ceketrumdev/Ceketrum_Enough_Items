plugins {
    // Fabric 26.x : nouveau plugin, ne remappe plus rien (les jars Mojang sont
    // deobfusques d'origine). L'ancien dev.architectury.loom exige toujours une
    // configuration 'mappings', qui n'existe plus en 26.x -- d'ou le changement.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    // NeoForge : plugin officiel ModDevGradle, sans mappings lui non plus.
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

allprojects {
    apply plugin: 'idea'
    apply plugin: 'eclipse'

    group = 'com.ceketrum'
    version = '0.1.4'
}
