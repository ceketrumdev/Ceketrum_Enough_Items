# JDK 25 requis par Minecraft 26.x pour la JVM Gradle elle-meme (pas seulement
# pour la compilation). Renseigne ICI et non via JAVA_HOME : G1..G6 compilent en
# Java 21 avec Loom 1.14, une bascule globale les casserait.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.4.7-hotspot

org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod Properties
mod_version=0.1.5
maven_group=com.ceketrum
archives_base_name=cei

# Minecraft & toolchain -- releve dans le jar reel 26.2 et le blog Fabric 26.2
minecraft_version=26.2
loom_version=1.17-SNAPSHOT   # informatif : le litteral fait foi dans build.gradle

# Mod Loaders
loader_version=0.19.3
fabric_api_version=0.154.2+26.2
neoforge_version=26.2.0.17-beta
