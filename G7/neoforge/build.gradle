plugins {
    id 'dev.architectury.loom'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-G7-neoforge"
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.architectury.dev/" }
}

loom {
    silentMojangMappingsLicense()
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "../common/src/main/java"]
        }
        resources {
            srcDirs = ["src/main/resources", "../common/src/main/resources"]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version

    filesMatching(["META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
        expand "version": inputs.properties.version
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
