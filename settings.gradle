pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'cei'

include 'G1:fabric'
// NeoForge 47.x pour 1.20.1 : encore un fork direct de Forge, packages
// net.minecraftforge.*. Le jar produit devrait aussi se charger sous
// MinecraftForge 47.x, a verifier en jeu.
include 'G1:neoforge'

include 'G2:fabric'
include 'G2:neoforge'

include 'G3:fabric'
include 'G3:neoforge'

include 'G4:fabric'
include 'G4:neoforge'

include 'G5:fabric'
include 'G5:neoforge'

include 'G6:fabric'
include 'G6:neoforge'

// G7 (26.1 -> 26.3) est un build Gradle AUTONOME, volontairement absent d'ici :
// il exige Loom 1.17 / Gradle 9.5.1 / Java 25, incompatibles avec G1..G6.
// Il se construit depuis G7/ ; build_all.bat enchaine les deux.
